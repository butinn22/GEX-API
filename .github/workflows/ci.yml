name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install --upgrade pip
          pip install .[dev]
      - name: Lint
        run: ruff check trading
      - name: Test
        run: pytest trading/tests -q --cov=trading --cov-report=term-missing --cov-fail-under=85
