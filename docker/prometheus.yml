global:
  scrape_interval: 15s

# Alert rules live in their own file so compose can mount them read-only.
rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "gex-trading"
    metrics_path: /metrics
    static_configs:
      - targets: ["app:8000"]
