[project]
name = "gex-api"
version = "0.1.0"
description = "GEX auto-trading platform (BingX + TBANK) with Monte-Carlo backtesting"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "numpy>=1.26",
    "pandas>=2.1",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.19",
    "asyncpg>=0.29",
    "redis>=5.0",
    "celery>=5.3",
    "httpx>=0.27",
    "python-jose[cryptography]>=3.3",
    "cryptography>=42.0",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "alembic>=1.13",
    "tinkoff-invest>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "hypothesis>=6.98",
    "ruff>=0.3",
    "mypy>=1.9",
    "black>=24.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["trading*"]

[tool.setuptools.package-data]
trading = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["trading/tests"]

[tool.ruff]
line-length = 100

# NOTE: TA-Lib / pandas-ta indicators are an optional enhancement (TA-Lib needs
# the C library on the host); example strategies use pure-numpy SMAs.
